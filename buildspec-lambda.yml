version: 0.2

env:
  variables:
    FUNCTION_NAME: receiptvault-processor
    S3_BUCKET: receiptvault-lambda-deployments-<AWS_ACCOUNT_ID>

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - cd apps/lambda
      - npm ci
  build:
    commands:
      - DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" npm run build
      - mkdir -p pkg && cp -r dist/* pkg/
      - cd pkg && npm init -y > /dev/null 2>&1
      - cp ../package.json temp-pkg.json
      - node -e "const p=require('./temp-pkg.json'); const n={dependencies:p.dependencies}; require('fs').writeFileSync('package.json',JSON.stringify(n))"
      - npm install --production --ignore-scripts
      - rm -rf node_modules/@prisma/engines node_modules/prisma
      - find node_modules/.prisma -name "*.wasm" ! -name "*postgresql*" -delete 2>/dev/null || true
      - find node_modules -name "*.d.ts" -delete 2>/dev/null || true
      - find node_modules -name "*.map" -delete 2>/dev/null || true
      - rm -f temp-pkg.json
      - zip -r ../function.zip .
      - cd ..
  post_build:
    commands:
      - aws s3 cp function.zip s3://$S3_BUCKET/function.zip
      - aws lambda update-function-code --function-name $FUNCTION_NAME --s3-bucket $S3_BUCKET --s3-key function.zip
