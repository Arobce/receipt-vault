version: 0.2

env:
  variables:
    ECR_REPO: 111584419354.dkr.ecr.us-east-1.amazonaws.com/receiptvault-web
    AWS_DEFAULT_REGION: us-east-1
    NEXT_PUBLIC_API_URL: REPLACE_WITH_API_URL

phases:
  pre_build:
    commands:
      - echo Logging in to ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPO
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:-latest}
  build:
    commands:
      - echo Building Web Docker image...
      - cd apps/web
      - docker build --platform linux/amd64 --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL -t $ECR_REPO:latest -t $ECR_REPO:$IMAGE_TAG .
  post_build:
    commands:
      - echo Pushing to ECR...
      - docker push $ECR_REPO:latest
      - docker push $ECR_REPO:$IMAGE_TAG
      - echo Updating ECS service...
      - aws ecs update-service --cluster receiptvault --service receiptvault-web-service --force-new-deployment
